name: Release

# Push a tag like v1.9.0 to build the mod and publish it as a GitHub Release.
# The tag must match `version` in gradle.properties.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Check tag matches mod version
        run: |
          MOD_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v${MOD_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version=${MOD_VERSION} in gradle.properties"
            exit 1
          fi
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          name: Survival Tweaks ${{ github.ref_name }}
          body: |
            Survival Tweaks ${{ github.ref_name }} for Minecraft 26.3 (Fabric).

            Requires Fabric Loader 0.19.5+ and Fabric API. Install on both client and server.
            Full feature list: [FEATURES.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/FEATURES.md)
          files: |
            build/libs/survivaltweaks-*.jar
          fail_on_unmatched_files: true
